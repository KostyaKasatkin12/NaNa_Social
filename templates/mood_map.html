<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта мародёров - НаНа</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f0c29;
            min-height: 100vh;
            color: white;
        }

        #map {
            height: 70vh;
            width: 100%;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Кастомные стили для Leaflet */
        .leaflet-control-zoom {
            border: none !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3) !important;
        }

        .leaflet-control-zoom a {
            background: rgba(30, 30, 60, 0.9) !important;
            color: white !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 18px !important;
        }

        .leaflet-control-zoom a:hover {
            background: rgba(139, 92, 246, 0.6) !important;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 50, 0.95) !important;
            backdrop-filter: blur(20px);
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5) !important;
        }

        .leaflet-popup-tip {
            background: rgba(20, 20, 50, 0.95) !important;
        }

        .leaflet-popup-content {
            min-width: 200px;
            padding: 8px 4px;
        }

        .leaflet-popup-close-button {
            color: rgba(255, 255, 255, 0.5) !important;
            font-size: 20px !important;
            padding: 8px !important;
        }

        .leaflet-popup-close-button:hover {
            color: white !important;
        }

        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .custom-marker:hover {
            transform: scale(1.2);
            border-color: white;
        }

        .custom-marker .count {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-card .label {
            font-size: 0.7rem;
            opacity: 0.5;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .anonymous-badge {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            font-size: 0.7rem;
            color: #a78bfa;
            margin-left: 8px;
        }

        .city-popup-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }

        .city-popup-mood {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .city-popup-count {
            font-size: 0.8rem;
            opacity: 0.5;
            margin-top: 2px;
        }

        .city-popup-distribution {
            margin-top: 8px;
            display: flex;
            gap: 4px;
            height: 4px;
            border-radius: 4px;
            overflow: hidden;
        }

        .city-popup-distribution .seg {
            height: 100%;
            border-radius: 4px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .float-animation {
            animation: float 3s ease-in-out infinite;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .map-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
        }

        .map-overlay {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            white-space: nowrap;
        }

        .map-overlay i {
            color: #8b5cf6;
            margin-right: 6px;
        }

        @media (max-width: 768px) {
            #map {
                height: 55vh;
            }
            .map-overlay {
                font-size: 0.7rem;
                padding: 6px 14px;
                top: 10px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-4 md:p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
                <div>
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                        <i class="fas fa-map text-blue-400 mr-2"></i>
                        Карта мародёров
                    </h1>
                    <p class="text-gray-400 text-sm">
                        <i class="fas fa-thermometer-half mr-1"></i>
                        Настроения городов в реальном времени
                        <span class="anonymous-badge"><i class="fas fa-user-secret mr-1"></i>Анонимно</span>
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-gray-400" id="totalUsersBadge">
                        <i class="fas fa-users mr-1"></i>
                        <span id="totalUsersCount">0</span>
                    </span>
                    <a href="{{ url_for('home') }}" class="back-home text-sm">
                        <i class="fas fa-home"></i>
                        На главную
                    </a>
                </div>
            </div>

            <!-- Статистика -->
            <div class="stats-grid mb-4" id="statsGrid">
                <div class="stat-card">
                    <div class="number text-blue-400" id="statCities">0</div>
                    <div class="label">Городов</div>
                </div>
                <div class="stat-card">
                    <div class="number text-green-400" id="statPositive">0</div>
                    <div class="label">Позитивных</div>
                </div>
                <div class="stat-card">
                    <div class="number text-red-400" id="statNegative">0</div>
                    <div class="label">Негативных</div>
                </div>
                <div class="stat-card">
                    <div class="number text-purple-400" id="statTotalUsers">0</div>
                    <div class="label">Пользователей</div>
                </div>
            </div>

            <!-- Карта -->
            <div class="map-container">
                <div class="map-overlay">
                    <i class="fas fa-location-dot"></i>
                    Наведи на маркер для информации о городе
                </div>
                <div id="map"></div>
            </div>

            <!-- Легенда -->
            <div class="flex flex-wrap gap-2 mt-4 p-3 bg-white/5 rounded-2xl backdrop-blur-sm border border-white/10 justify-center">
                <span class="text-gray-400 text-sm font-medium mr-1">Настроения:</span>
                <div class="legend-item"><span class="legend-dot" style="background: #34d399;"></span> Очень позитивное</div>
                <div class="legend-item"><span class="legend-dot" style="background: #60a5fa;"></span> Позитивное</div>
                <div class="legend-item"><span class="legend-dot" style="background: #9ca3af;"></span> Нейтральное</div>
                <div class="legend-item"><span class="legend-dot" style="background: #f87171;"></span> Негативное</div>
                <div class="legend-item"><span class="legend-dot" style="background: #dc2626;"></span> Очень негативное</div>
            </div>
        </div>
    </div>

            'Химки': [55.8980, 37.4298],
            'Щёлково': [55.9110, 37.7592]
        };

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        let map = null;
        let markers = [];
        let cityData = [];
        let currentPopup = null;

        // Цвета для настроений
        const MOOD_COLORS = {
            'very_positive': '#34d399',
            'positive': '#60a5fa',
            'neutral': '#9ca3af',
            'negative': '#f87171',
            'very_negative': '#dc2626',
            'angry': '#ef4444',
            'surprised': '#fbbf24',
            'fearful': '#a78bfa',
            'joyful': '#34d399',
            'sad': '#60a5fa'
        };

        const MOOD_EMOJIS = {
            'very_positive': '🥳',
            'positive': '😊',
            'neutral': '😐',
            'negative': '😔',
            'very_negative': '😢',
            'angry': '😡',
            'surprised': '😮',
            'fearful': '😨',
            'joyful': '😄',
            'sad': '😭'
        };

        const MOOD_LABELS = {
            'very_positive': 'Очень позитивное',
            'positive': 'Позитивное',
            'neutral': 'Нейтральное',
            'negative': 'Негативное',
            'very_negative': 'Очень негативное',
            'angry': 'Злое',
            'surprised': 'Удивлённое',
            'fearful': 'Испуганное',
            'joyful': 'Радостное',
            'sad': 'Грустное'
        };

        // ==================== ИНИЦИАЛИЗАЦИЯ КАРТЫ ====================

        function initMap() {
            map = L.map('map', {
                center: [55.7558, 37.6173],
                zoom: 5,
                zoomControl: false,
                fadeAnimation: true,
                zoomAnimation: true
            });

            // Добавляем зум контролы
            L.control.zoom({
                position: 'topright'
            }).addTo(map);

            // Тёмный стиль карты
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19,
                minZoom: 3
            }).addTo(map);

            // Добавляем поиск городов
            const geocoder = L.Control.geocoder({
                position: 'topleft',
                placeholder: 'Поиск города...',
                defaultMarkGeocode: false,
                collapsed: true
            }).on('markgeocode', function(e) {
                const center = e.geocode.center;
                map.setView(center, 10);
            }).addTo(map);

            loadCityData();
        }

        // ==================== ЗАГРУЗКА ДАННЫХ ====================

        function loadCityData() {
            fetch('/api/cities/stats')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        cityData = data.data;
                        updateStats(cityData);
                        updateMapMarkers(cityData);
                    } else {
                        showError('Ошибка загрузки данных');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Ошибка соединения с сервером');
                });
        }

        // ==================== ОБНОВЛЕНИЕ СТАТИСТИКИ ====================

        function updateStats(cities) {
            const totalCities = cities.length;
            const positive = cities.filter(c => ['very_positive', 'positive', 'joyful'].includes(c.dominant_mood)).length;
            const negative = cities.filter(c => ['very_negative', 'negative', 'angry', 'sad'].includes(c.dominant_mood)).length;
            const totalUsers = cities.reduce((sum, c) => sum + c.count, 0);

            document.getElementById('statCities').textContent = totalCities;
            document.getElementById('statPositive').textContent = positive;
            document.getElementById('statNegative').textContent = negative;
            document.getElementById('statTotalUsers').textContent = totalUsers;
            document.getElementById('totalUsersCount').textContent = totalUsers;
        }

        // ==================== СОЗДАНИЕ МАРКЕРОВ ====================

        function updateMapMarkers(cities) {
            // Удаляем старые маркеры
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // Закрываем текущий попап
            if (currentPopup) {
                map.closePopup(currentPopup);
                currentPopup = null;
            }

            if (!cities || cities.length === 0) {
                // Показываем сообщение на карте
                const message = L.control({ position: 'bottomleft' });
                message.onAdd = function() {
                    const div = L.DomUtil.create('div', 'text-center text-gray-400 text-sm p-4 bg-black/50 rounded-xl backdrop-blur-sm');
                    div.innerHTML = '🗺️ Нет данных о городах';
                    return div;
                };
                message.addTo(map);
                return;
            }

            cities.forEach(city => {
                const coords = RUSSIAN_CITIES_COORDS[city.city];
                if (!coords) {
                    console.warn('Нет координат для города:', city.city);
                    return;
                }

                const color = MOOD_COLORS[city.dominant_mood] || '#9ca3af';
                const emoji = MOOD_EMOJIS[city.dominant_mood] || '😐';
                const label = MOOD_LABELS[city.dominant_mood] || 'Нейтральное';

                // Создаём кастомный HTML маркер
                const iconHtml = `
                    <div class="custom-marker" style="background: ${color}40; border-color: ${color};">
                        <span style="font-size: 22px;">${emoji}</span>
                        <span class="count" style="background: ${color}; color: white;">${city.count}</span>
                    </div>
                `;

                const icon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [44, 44],
                    iconAnchor: [22, 44],
                    popupAnchor: [0, -40]
                });

                // Создаём маркер
                const marker = L.marker(coords, { icon: icon })
                    .addTo(map)
                    .bindPopup(createPopupContent(city), {
                        maxWidth: 280,
                        minWidth: 200,
                        className: 'custom-popup'
                    });

                // Сохраняем ссылку на попап
                marker.on('popupopen', function(e) {
                    currentPopup = e.popup;
                });

                marker.on('popupclose', function() {
                    currentPopup = null;
                });

                markers.push(marker);
            });

            // Если есть города, центрируем карту по первому
            if (cities.length > 0 && markers.length > 0) {
                const firstCity = cities[0];
                const coords = RUSSIAN_CITIES_COORDS[firstCity.city];
                if (coords) {
                    map.setView(coords, 5);
                }
            }
        }

        // ==================== СОЗДАНИЕ ПОПАПА ====================

        function createPopupContent(city) {
            const emoji = MOOD_EMOJIS[city.dominant_mood] || '😐';
            const label = MOOD_LABELS[city.dominant_mood] || 'Нейтральное';
            const color = MOOD_COLORS[city.dominant_mood] || '#9ca3af';

            const distribution = city.mood_distribution || {};
            const total = Object.values(distribution).reduce((a, b) => a + b, 0) || 1;

            let distributionHtml = '';
            const sorted = Object.entries(distribution).sort((a, b) => b[1] - a[1]);
            const colors = ['#34d399', '#60a5fa', '#9ca3af', '#f87171', '#dc2626', '#ef4444', '#fbbf24', '#a78bfa'];

            sorted.slice(0, 5).forEach(([mood, count], index) => {
                const percent = Math.round(count / total * 100);
                const moodColor = MOOD_COLORS[mood] || colors[index % colors.length];
                const moodLabel = MOOD_LABELS[mood] || mood;
                distributionHtml += `
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 2px 0;">
                        <span style="color: ${moodColor}; font-size: 0.7rem;">●</span>
                        <span style="flex: 1; color: rgba(255,255,255,0.6);">${moodLabel}</span>
                        <span style="color: rgba(255,255,255,0.4);">${percent}%</span>
                        <div style="width: 40px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
                            <div style="width: ${percent}%; height: 100%; background: ${moodColor}; border-radius: 4px;"></div>
                        </div>
                    </div>
                `;
            });

            return `
                <div style="padding: 4px 0;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                        <span style="font-size: 28px;">${emoji}</span>
                        <div>
                            <div style="font-size: 18px; font-weight: 700; color: white;">${city.city}</div>
                            <div style="font-size: 13px; color: rgba(255,255,255,0.5);">${label}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px; margin-bottom: 8px; font-size: 12px; color: rgba(255,255,255,0.4);">
                        <span><i class="fas fa-user" style="margin-right: 4px;"></i>${city.count}</span>
                        <span><i class="fas fa-clock" style="margin-right: 4px;"></i>Обновлено сейчас</span>
                    </div>
                    <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; margin-top: 4px;">
                        <div style="font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 4px;">Распределение настроений</div>
                        ${distributionHtml}
                    </div>
                    <div style="margin-top: 6px; font-size: 10px; color: rgba(255,255,255,0.2); text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px;">
                        <i class="fas fa-user-secret" style="margin-right: 4px;"></i>
                        Данные анонимны
                    </div>
                </div>
            `;
        }

        // ==================== ОБРАБОТКА ОШИБОК ====================

        function showError(message) {
            const container = document.getElementById('map');
            container.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: rgba(15, 12, 41, 0.8); border-radius: 20px;">
                    <div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>
                    <h3 style="color: #f87171; font-size: 20px; font-weight: 600; margin-bottom: 8px;">${message}</h3>
                    <button onclick="location.reload()" style="padding: 10px 24px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
                        Попробовать снова
                    </button>
                </div>
            `;
        }

        // ==================== ОБНОВЛЕНИЕ КАРТЫ ====================

        function refreshMap() {
            if (map) {
                // Очищаем маркеры
                markers.forEach(marker => map.removeLayer(marker));
                markers = [];
                loadCityData();
            }
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================

        document.addEventListener('DOMContentLoaded', function() {
            // Проверяем, что Leaflet загружен
            if (typeof L !== 'undefined') {
                initMap();
            } else {
                console.error('Leaflet не загружен');
                document.getElementById('map').innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: rgba(15, 12, 41, 0.8); border-radius: 20px;">
                        <div style="font-size: 48px; margin-bottom: 16px;">🗺️</div>
                        <h3 style="color: #9ca3af; font-size: 18px; font-weight: 600;">Загрузка карты...</h3>
                        <div class="loading-spinner" style="margin-top: 16px;"></div>
                    </div>
                `;
                // Пробуем загрузить Leaflet динамически
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.onload = function() {
                    initMap();
                };
                document.head.appendChild(script);
            }

            // Автообновление каждые 60 секунд
            setInterval(refreshMap, 60000);
        });

        // Обновляем при переключении вкладки
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                refreshMap();
            }
        });
    </script>
</body>
</html>
