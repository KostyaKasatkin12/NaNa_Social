<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимный чат - НаНа</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: white;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6366f1, #8b5cf6);
            border-radius: 10px;
        }

        .message-anon {
            animation: fadeInUp 0.3s ease-out;
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #8b5cf6;
            transition: all 0.3s ease;
            max-width: 80%;
        }

        .message-anon:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .message-anon .time {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 4px;
        }

        .message-anon .content {
            font-size: 1rem;
            line-height: 1.6;
        }

        .message-system {
            text-align: center;
            padding: 8px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        .input-area {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0 0 24px 24px;
        }

        .input-area input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 18px;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
        }

        .input-area input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-send {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 16px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        .user-count {
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .join-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            height: 100%;
            min-height: 400px;
        }

        .join-screen h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .join-screen p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }

        .room-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 20px;
            color: white;
            width: 100%;
            max-width: 400px;
            text-align: center;
            font-size: 1.2rem;
        }

        .room-input:focus {
            outline: none;
            border-color: #8b5cf6;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                        <i class="fas fa-user-secret text-purple-400 mr-3"></i>
                        Анонимный чат
                    </h1>
                    <p class="text-gray-400 text-sm mt-1">
                        <i class="fas fa-shield-alt mr-2 text-green-400"></i>
                        Вы полностью анонимны. Говорите о чём угодно!
                    </p>
                </div>
                <div class="flex items-center gap-4">
                    <span class="user-count" id="userCount">
                        <i class="fas fa-users mr-1"></i>
                        <span id="userCountValue">0</span>
                    </span>
                    <a href="{{ url_for('home') }}"
                       class="px-4 py-2 bg-white/10 rounded-xl hover:bg-white/20 transition flex items-center gap-2 text-sm">
                        <i class="fas fa-home"></i>
                        Выйти
                    </a>
                </div>
            </div>

            <!-- Chat Container -->
            <div class="chat-container">
                <!-- Join Screen -->
                <div id="joinScreen" class="join-screen">
                    <div class="text-6xl mb-4">🤝</div>
                    <h2>Добро пожаловать в анонимный чат!</h2>
                    <p>Здесь вы можете делиться своими мыслями, не раскрывая личность</p>

                    <div class="flex flex-col sm:flex-row gap-4 w-full max-w-md">
                        <input type="text" id="roomInput" placeholder="Введите ID комнаты или создайте новую"
                               class="room-input flex-1">
                        <button onclick="joinOrCreateRoom()"
                                class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl hover:shadow-lg transition flex items-center justify-center gap-2">
                            <i class="fas fa-sign-in-alt"></i>
                            Войти / Создать
                        </button>
                    </div>

                    <button onclick="createRandomRoom()"
                            class="mt-4 text-sm text-purple-400 hover:text-purple-300 transition">
                        <i class="fas fa-random mr-1"></i>
                        Создать случайную комнату
                    </button>
                </div>

                <!-- Chat Area -->
                <div id="chatArea" class="hidden flex-1 flex-col">
                    <!-- Messages -->
                    <div id="messagesContainer" class="messages-container">
                        <div class="message-system">
                            <i class="fas fa-info-circle mr-1"></i>
                            Вы присоединились к анонимному чату. Все сообщения анонимны.
                        </div>
                    </div>

                    <!-- Typing indicator -->
                    <div id="typingIndicator" class="typing-indicator hidden px-6">
                        <span></span><span></span><span></span>
                        <span class="text-gray-400 text-sm ml-2">Кто-то печатает...</span>
                    </div>

                    <!-- Input -->
                    <div class="input-area">
                        <div class="flex gap-3">
                            <input type="text" id="messageInput"
                                   placeholder="Напишите сообщение..."
                                   class="flex-1"
                                   onkeypress="if(event.key==='Enter') sendMessage()">
                            <button onclick="sendMessage()" class="btn-send">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        <div class="text-xs text-gray-500 mt-2">
                            <i class="fas fa-lock mr-1"></i>
                            Анонимно • Ваша личность скрыта
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let roomId = null;
        let isInRoom = false;

        // Конфигурация
        const USER_ID = {{ session['user_id'] | tojson }};

        // Элементы
        const joinScreen = document.getElementById('joinScreen');
        const chatArea = document.getElementById('chatArea');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const roomInput = document.getElementById('roomInput');
        const userCountValue = document.getElementById('userCountValue');
        const typingIndicator = document.getElementById('typingIndicator');

        // ============ ФУНКЦИИ ============

        function joinOrCreateRoom() {
            const room = roomInput.value.trim();
            if (!room) {
                alert('Пожалуйста, введите ID комнаты');
                return;
            }
            joinRoom(room);
        }

        function createRandomRoom() {
            const room = 'room_' + Math.random().toString(36).substring(2, 8);
            roomInput.value = room;
            joinRoom(room);
        }

        function joinRoom(room) {
            roomId = room;

            fetch(`/api/anonymous/join/${roomId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    isInRoom = true;
                    joinScreen.classList.add('hidden');
                    chatArea.classList.remove('hidden');

                    // Подключаемся к WebSocket комнате
                    socket.emit('anonymous_join', { room_id: roomId });

                    // Загружаем историю
                    loadMessages();

                    messageInput.focus();
                } else {
                    alert('Ошибка: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error joining room:', error);
                alert('Ошибка подключения к комнате');
            });
        }

        function loadMessages() {
            fetch(`/api/anonymous/messages/${roomId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderMessages(data.messages);
                        userCountValue.textContent = data.users_count || 0;
                    }
                })
                .catch(console.error);
        }

        function renderMessages(messages) {
            // Удаляем старые сообщения (кроме системных)
            const systemMessages = messagesContainer.querySelectorAll('.message-system');
            messagesContainer.innerHTML = '';
            systemMessages.forEach(el => messagesContainer.appendChild(el));

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message-anon';
                div.innerHTML = `
                    <div class="content">${escapeHtml(msg.content)}</div>
                    <div class="time">${formatTime(msg.created_at)}</div>
                `;
                messagesContainer.appendChild(div);
            });

            scrollToBottom();
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !roomId || !isInRoom) return;

            socket.emit('anonymous_message', {
                room_id: roomId,
                content: content
            });

            messageInput.value = '';
            messageInput.focus();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // ============ WEBSOCKET ОБРАБОТЧИКИ ============

        socket.on('anonymous_history', function(data) {
            renderMessages(data.messages);
            userCountValue.textContent = data.users_count || 0;
        });

        socket.on('anonymous_new_message', function(data) {
            const div = document.createElement('div');
            div.className = 'message-anon';
            div.innerHTML = `
                <div class="content">${escapeHtml(data.content)}</div>
                <div class="time">${formatTime(data.created_at)}</div>
            `;
            messagesContainer.appendChild(div);
            scrollToBottom();
        });

        socket.on('anonymous_users_update', function(data) {
            userCountValue.textContent = data.users_count || 0;
        });

        // ============ ОБРАБОТЧИКИ КЛАВИАТУРЫ ============

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (isInRoom) {
                    if (confirm('Выйти из анонимного чата?')) {
                        socket.emit('anonymous_leave', { room_id: roomId });
                        isInRoom = false;
                        chatArea.classList.add('hidden');
                        joinScreen.classList.remove('hidden');
                        roomInput.value = '';
                    }
                }
            }
        });

        // Автофокус на input при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            roomInput.focus();
        });
    </script>
</body>
</html>
